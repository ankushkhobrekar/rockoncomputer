<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Connect with Rock On Enterprises on WhatsApp and Instagram.">
  <title>Rock On Enterprises | Connect With Us</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1220; --panel:#111c2e; --text:#f8fafc; --muted:#b6c2d3; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #20385b 0, #0b1220 52%);
    }
    main {
      width: min(100%, 440px); padding: 30px 22px;
      border: 1px solid #2a3a52; border-radius: 24px;
      background: rgba(17,28,46,.96); box-shadow: 0 24px 70px #0007;
      text-align: center;
    }
    .logo {
      width: 76px; height: 76px; margin: 0 auto 16px; border-radius: 20px;
      display: grid; place-items: center; font-size: 25px; font-weight: 900;
      letter-spacing: -2px; color: white;
      background: linear-gradient(135deg, #2563eb 0 50%, #16a34a 50% 100%);
      box-shadow: 0 8px 28px #0005;
    }
    h1 { font-size: clamp(24px, 6vw, 30px); line-height: 1.15; margin: 0; }
    .subtitle { color: var(--muted); margin: 12px 0 26px; font-size: 15px; }
    .links { display: grid; gap: 13px; }
    .btn {
      display: flex; align-items: center; gap: 14px; width: 100%;
      padding: 16px; border-radius: 14px; color: #fff; text-decoration: none;
      text-align: left; font-weight: 750; transition: transform .15s, filter .15s;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .btn .emoji { width: 34px; font-size: 26px; text-align: center; }
    .btn .label { flex: 1; }
    .btn small { display: block; margin-top: 3px; font-size: 12px; font-weight: 500; opacity: .9; }
    .wa { background: #20b85a; }
    .group { background: #087f70; }
    .ig { background: linear-gradient(110deg, #833ab4, #e1306c, #f77737); }
    .arrow { font-size: 22px; opacity: .9; }
    footer { color: #94a3b8; font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-label="Rock On Enterprises logo">RO</div>
    <h1>ROCK ON ENTERPRISES</h1>
    <p class="subtitle">Connect with us — choose an option below.</p>
    <nav class="links" aria-label="Social links">
      <a class="btn wa" href="https://wa.me/919773571186" target="_blank" rel="noopener noreferrer">
        <span class="emoji" aria-hidden="true">💬</span>
        <span class="label">Chat on WhatsApp<small>Message us directly</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="btn group" href="https://chat.whatsapp.com/DeSb3kxghejLJAHGg00PBo" target="_blank" rel="noopener noreferrer">
        <span class="emoji" aria-hidden="true">👥</span>
        <span class="label">Join WhatsApp Group<small>Join our community</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="btn ig" href="https://www.instagram.com/rockonenterprises/" target="_blank" rel="noopener noreferrer">
        <span class="emoji" aria-hidden="true">📸</span>
        <span class="label">Follow on Instagram<small>See our latest updates</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
    <footer>Rock On Enterprises · Thank you for connecting with us!</footer>
  </main>
</body>
</html>
